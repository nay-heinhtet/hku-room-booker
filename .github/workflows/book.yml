name: HKU Room Booker

on:
  # Primary trigger: the web app's nightly dispatcher (or any external cron,
  # e.g. cron-job.org) sends a repository_dispatch at ~23:50 HKT. GitHub's own
  # schedule queue is best-effort and has been starting runs 2-6 hours late,
  # so it is only a backup. Python waits locally until midnight before booking.
  repository_dispatch:
    types: [scheduled-booking]

  # Backup: 23:45 HKT = 15:45 UTC (often delayed by GitHub).
  schedule:
    - cron: '45 15 * * *'

  # Manual trigger: go to Actions -> HKU Room Booker -> Run workflow
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to book (YYYY-MM-DD)'
        required: true
      time:
        description: 'Start time HH:MM'
        required: true
        default: '10:00'
      duration:
        description: 'Hours (1 or 2)'
        default: '1'
      room_target:
        description: 'Room target'
        required: true
        default: 'all_study_rooms'
        type: choice
        options:
          - all_study_rooms
          - chi_wah_study_rooms
          - chi_wah_study_booths
          - discussion_rooms
          - single_study_rooms
          - study_tables
          - main_library_discussion_rooms
          - main_library_single_study_rooms
          - dental_discussion_rooms
          - law_discussion_rooms
          - medical_discussion_rooms
          - medical_single_study_rooms
          - music_discussion_rooms

jobs:
  # Nightly pre-check: finishes in seconds when nothing is due, so private
  # copies don't spend Actions minutes installing Chromium every night.
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check for due bookings
        id: due
        run: python3 due_check.py >> "$GITHUB_OUTPUT"

  book:
    needs: check
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.due == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit bookings.json status updates
    # Nightly runs never overlap: a late backup run waits for the on-time one,
    # then finds the entries already processed. Manual runs never wait.
    concurrency:
      group: booker-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'nightly' }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Branch tip rather than the trigger commit, so a delayed run sees
          # statuses committed by an earlier one.
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install chromium --with-deps

      # Nightly run: books the queued entries whose booking window opens at midnight.
      - name: Book scheduled entries
        id: scheduled
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          HKU_UID: ${{ secrets.HKU_UID }}
          HKU_PIN: ${{ secrets.HKU_PIN }}
        run: python run_scheduled.py

      - name: Commit updated bookings.json
        if: always() && github.event_name != 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bookings.json
          git diff --staged --quiet || git commit -m "chore: update booking status [skip ci]"
          git pull --rebase
          git push

      - name: Fail scheduled run if due booking failed
        if: github.event_name != 'workflow_dispatch' && steps.scheduled.outcome == 'failure'
        run: exit 1

      # Manual run: automatically books now for today/tomorrow, otherwise queues future.
      - name: Run manual request
        if: github.event_name == 'workflow_dispatch'
        env:
          HKU_UID: ${{ secrets.HKU_UID }}
          HKU_PIN: ${{ secrets.HKU_PIN }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_TIME: ${{ inputs.time }}
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_ROOM_TARGET: ${{ inputs.room_target }}
        run: |
          python run_manual.py             --date "$INPUT_DATE"             --time "$INPUT_TIME"             --duration "$INPUT_DURATION"             --room-target "$INPUT_ROOM_TARGET"

      - name: Commit queued future booking
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bookings.json
          git diff --staged --quiet || git commit -m "chore: queue room booking [skip ci]"
          git pull --rebase
          git push

      # Upload logs as an artifact visible in the Actions UI.
      - name: Upload booking log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-log-${{ github.run_id }}
          path: logs/bookings.log
          if-no-files-found: ignore
